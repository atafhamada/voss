name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (CUDA 12.8)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu22.04
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake build-essential python3 python3-pip

      - name: Show toolchain versions
        run: |
          nvcc --version
          cmake --version
          python3 --version

      - name: Configure
        working-directory: library
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: library
        run: cmake --build build -j$(nproc)

      - name: Verify artifacts
        working-directory: library
        run: |
          test -f build/libvoss_core.a
          test -f build/libvoss.so
          test -f build/test_prime_count
          echo "All artifacts present."
